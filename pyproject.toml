[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docxjs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["bs4>=0.0.2", "lxml>=6.0.2", "streamlit>=1.51.0"]

[dependency-groups]
dev = [
    "basedpyright>=1.33.0",
    "pytest>=9.0.0",
    "ruff>=0.14.4",
    "streamlit>=1.51.0",
]

[tool.ruff.lint]
select = ['ALL']
